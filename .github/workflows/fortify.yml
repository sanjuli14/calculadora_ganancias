
name: Build & Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write   # 👈 IMPORTANTE

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: 'stable'

      - name: Set up keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/keystore_b64.txt
          base64 --decode /tmp/keystore_b64.txt > android/app/cuentasclaras-keystore.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: Verify keystore was written
        run: |
          ls -la android/app/cuentasclaras-keystore.jks
          sha256sum android/app/cuentasclaras-keystore.jks
          test -s android/key.properties && echo "key.properties OK"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify keystore checksum
        run: |
          EXPECTED="dac4489fe2fd899a97eb5e152f7f5f5918fe2883926a00b8605f7791d94403ff"
          ACTUAL=$(sha256sum android/app/cuentasclaras-keystore.jks | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "KEYSTORE CORRUPT: checksum mismatch"
            exit 1
          fi
          echo "Keystore verified OK"

      - name: Build APK (Release ARM64)
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64

      - name: Get version
        id: version
        run: |
          VERSION=$(grep version: pubspec.yaml | cut -d ' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Calculadora de Ganancias v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publica el APK en el canal de Telegram para que los clientes lo
      # descarguen e instalen sin pasar por GitHub.
      # Requiere:
      #   - Crear un bot con @BotFather y agregarlo como admin del canal.
      #   - Guardar el token del bot como secret "TELEGRAM_BOT_TOKEN"
      #     en Settings → Secrets and variables → Actions.
      # Si el secret no existe, el paso se omite sin romper el release.
      - name: Publicar APK en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: '@cuentas_claras_app'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "No hay TELEGRAM_BOT_TOKEN configurado. Se omite la publicación."
            exit 0
          fi
          CAPTION=$(printf "🆕 *Cuentas Claras v%s* disponible.\nPresiona para instalarla y tener las últimas novedades." "$VERSION")
          # --http1.1 y -4 evitan el error (26) de curl 8.x con HTTP/2 al subir
          # multipart a api.telegram.org (problema conocido). -sS muestra errores.
          curl -sS --http1.1 -4 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHANNEL}" \
            -F "disable_notification=true" \
            -F "document=@build/app/outputs/flutter-apk/app-release.apk;filename=CuentasClaras_${VERSION}.apk" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown"
