name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/keystore_b64.txt
          base64 --decode /tmp/keystore_b64.txt > android/app/cuentasclaras-keystore.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: Verify keystore was written
        run: |
          ls -la android/app/cuentasclaras-keystore.jks
          sha256sum android/app/cuentasclaras-keystore.jks
          test -s android/key.properties && echo "key.properties OK"

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify keystore checksum
        run: |
          EXPECTED="dac4489fe2fd899a97eb5e152f7f5f5918fe2883926a00b8605f7791d94403ff"
          ACTUAL=$(sha256sum android/app/cuentasclaras-keystore.jks | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "KEYSTORE CORRUPT: checksum mismatch"
            exit 1
          fi
          echo "Keystore verified OK"

      - name: Verify APK is signed with release key
        run: |
          ls -la build/app/outputs/flutter-apk/app-release.apk
          echo "APK built successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
